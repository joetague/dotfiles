# gpg-agent options. Reload after editing: gpgconf --reload gpg-agent

# Passphrase prompts as a macOS dialog, so they work without a terminal
# (Emacs from the Dock: org :crypt:, auth-source, pass). Installed by the
# Brewfile. Leave its "Save in Keychain" box unticked: that would let any
# process decrypt without asking, coding agents included.
pinentry-program /opt/homebrew/bin/pinentry-mac

# How long an unlocked key stays usable without a prompt. While cached, any
# process running as this user can decrypt silently, so keep these short.
# Seconds since last use, then a hard cap.
default-cache-ttl 600
max-cache-ttl 3600
